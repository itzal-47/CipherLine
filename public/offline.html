<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0f">
    <title>Sem ligação — CipherLine</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background: #0a0a0f; color: #e8fff5; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; min-height: 100dvh; margin: 0; padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); display: grid; place-items: center; text-align: center; }
      main { width: min(100%, 28rem); }
      h1 { margin: 0 0 16px; color: #00ff9d; font-size: clamp(1.8rem, 8vw, 2.5rem); }
      p { margin: 0 0 28px; color: #e8fff5; font-size: 1rem; line-height: 1.6; }
      button { min-height: 44px; padding: 12px 20px; border: 1px solid #00ff9d; border-radius: 8px; background: transparent; color: #00ff9d; font: inherit; font-weight: 600; cursor: pointer; }
      button:focus-visible { outline: 2px solid #e8fff5; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Sem ligação</h1>
      <p>As mensagens cifradas continuam seguras. Tenta de novo.</p>
      <button type="button" onclick="location.reload()">Tentar de novo</button>
    </main>
  </body>
</html>
